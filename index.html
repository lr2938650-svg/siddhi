<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blind Friendship 💗</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
      :root {
        --bg: #0f0f14;
        --card: #17171f;
        --accent: #ff5c8a;
        --soft: #2a2a35;
        --text: #fff;
        --muted: #b5b5c3;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Poppins;
        background: radial-gradient(circle at top, #1c1c28, var(--bg));
        color: var(--text);
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: linear-gradient(180deg, var(--card), #121218);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      }
      .hidden {
        display: none;
      }
      input,
      button {
        width: 100%;
        padding: 12px;
        border-radius: 14px;
        border: none;
        margin-top: 10px;
      }
      input {
        background: var(--soft);
        color: var(--text);
      }
      button {
        background: linear-gradient(135deg, var(--accent), #ff85a8);
        font-weight: 500;
        cursor: pointer;
      }
      .chatbox {
        height: 260px;
        overflow-y: auto;
        background: var(--soft);
        padding: 14px;
        border-radius: 14px;
        margin-bottom: 10px;
      }
      .bubble {
        background: #242433;
        padding: 8px 12px;
        border-radius: 12px;
        margin-bottom: 6px;
        font-size: 14px;
        max-width: 85%;
        position: relative;
      }
      .me {
        background: #ff5c8a;
        color: #000;
        margin-left: auto;
      }
      .tick {
        font-size: 11px;
        color: #000;
        position: absolute;
        bottom: -14px;
        right: 6px;
      }
      .small {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
      img {
        border-radius: 10px;
        margin-top: 6px;
        max-width: 100%;
        filter: blur(8px);
        cursor: pointer;
        transition: 0.3s;
      }
      img.reveal {
        filter: blur(0);
      }
    </style>
  </head>
  <body>
    <!-- LOGIN -->
    <div class="card" id="login">
      <input id="username" placeholder="Your Name" />
      <input id="room" placeholder="Invite Code" />
      <button type="button" onclick="enter()">Enter Blind Friendship</button>
      <div class="small">Private • Encrypted • Real-time</div>
    </div>

    <!-- CHAT -->
    <div class="card hidden" id="chatCard">
      <div class="small">Blind Friendship 💬</div>
      <div class="chatbox" id="chat"></div>
      <div class="small" id="typing"></div>
      <input type="file" id="img" accept="image/*" />
      <input id="msg" placeholder="Type a message…" />
      <button onclick="sendMsg()">Send</button>
    </div>

    <script>
      // 🔐 INVITE & CHAT ROOM CODES
      const INVITE_CODE = "BLIND2026"; // entry gate
      const CHAT_ROOM_CODE = "ONLYUS"; // encryption + room key

      // ✅ FIREBASE CONFIG (CONNECTED)
      const firebaseConfig = {
        apiKey: "AIzaSyAdpLNU2c-C5KxJv2weJECSpoghz_NGNtM",
        authDomain: "soulroom-4e31d.firebaseapp.com",
        databaseURL:
          "https://soulroom-4e31d-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "soulroom-4e31d",
        storageBucket: "soulroom-4e31d.firebasestorage.app",
        messagingSenderId: "139421380646",
        appId: "1:139421380646:web:8dc4a4e166291102d2f6e7",
        measurementId: "G-58EWTHJZXS",
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      let user = "";

      function enter() {
        user = username.value.trim();
        if (room.value.trim() !== INVITE_CODE || !user) {
          alert("Invalid invite code");
          return;
        }
        login.classList.add("hidden");
        chatCard.classList.remove("hidden");
        listen();
      }

      // 🔐 Encryption helpers
      function encrypt(text) {
        return CryptoJS.AES.encrypt(text, CHAT_ROOM_CODE).toString();
      }
      function decrypt(text) {
        return CryptoJS.AES.decrypt(text, CHAT_ROOM_CODE).toString(
          CryptoJS.enc.Utf8,
        );
      }

      function sendMsg() {
        if (msg.value === "" && !img.files[0]) return;
        const ref = db.ref("rooms/" + CHAT_ROOM_CODE).push();
        const data = { user, time: Date.now(), seen: false };

        if (msg.value) data.text = encrypt(msg.value);

        if (img.files[0]) {
          const reader = new FileReader();
          reader.onload = (e) => {
            data.img = e.target.result;
            data.expire = Date.now() + 60000;
            ref.set(data);
          };
          reader.readAsDataURL(img.files[0]);
        } else {
          ref.set(data);
        }

        msg.value = "";
        img.value = "";
      }

      function listen() {
        const roomRef = db.ref("rooms/" + CHAT_ROOM_CODE);

        roomRef.on("child_added", (snap) => {
          const d = snap.val();
          if (d.expire && Date.now() > d.expire) {
            snap.ref.remove();
            return;
          }

          const div = document.createElement("div");
          div.className = "bubble" + (d.user === user ? " me" : "");

          if (d.text) {
            div.innerText = decrypt(d.text);
          }

          if (d.img) {
            const im = document.createElement("img");
            im.src = d.img;
            im.onclick = () => im.classList.toggle("reveal");
            div.appendChild(im);
            setTimeout(() => snap.ref.remove(), 60000);
          }

          if (d.user === user) {
            const tick = document.createElement("div");
            tick.className = "tick";
            tick.innerText = d.seen ? "✔✔" : "✔";
            div.appendChild(tick);
          }

          chat.appendChild(div);
          chat.scrollTop = chat.scrollHeight;
          snap.ref.update({ seen: true });
        });

        msg.addEventListener("input", () => {
          db.ref("typing/" + CHAT_ROOM_CODE).set(user);
          setTimeout(() => db.ref("typing/" + CHAT_ROOM_CODE).remove(), 1000);
        });

        db.ref("typing/" + CHAT_ROOM_CODE).on("value", (s) => {
          typing.innerText =
            s.val() && s.val() !== user ? s.val() + " is typing…" : "";
        });
      }
    </script>
  </body>
</html>
