<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blind Friendship 💗</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
:root{--bg:#0f0f14;--card:#17171f;--accent:#ff5c8a;--soft:#2a2a35;--text:#fff;--muted:#b5b5c3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Poppins;background:radial-gradient(circle at top,#1c1c28,var(--bg));color:var(--text)}
.card{width:100%;max-width:430px;background:linear-gradient(180deg,var(--card),#121218);border-radius:18px;padding:24px}
.hidden{display:none}
input,button{width:100%;padding:12px;border-radius:14px;border:none;margin-top:10px}
input{background:var(--soft);color:#fff}
button{background:linear-gradient(135deg,var(--accent),#ff85a8);cursor:pointer}
.chatbox{height:260px;overflow-y:auto;background:var(--soft);padding:14px;border-radius:14px}
.bubble{background:#242433;padding:8px 12px;border-radius:12px;margin-bottom:18px;max-width:85%;position:relative}
.me{background:#ff5c8a;color:#000;margin-left:auto}
.tick{font-size:11px;position:absolute;bottom:-14px;right:6px}
img{max-width:100%;border-radius:10px;filter:blur(8px);cursor:pointer}
img.reveal{filter:blur(0)}
.small{font-size:12px;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<div class="card" id="step1">
<input id="inviteName" placeholder="Your Name">
<input id="inviteCode" placeholder="Invite Code">
<button onclick="openMessage()">Continue</button>
</div>

<div class="card hidden" id="step2">
<div class="small">Do you want to start Blind Friendship?</div>
<button onclick="yesFlow()">Yes</button>
<button onclick="noFlow()">No</button>
</div>

<div class="card hidden" id="stepLogin">
<input id="chatCode" placeholder="Secret Chat Code">
<button onclick="enterChat()">Enter Chat</button>
</div>

<div class="card hidden" id="stepChat">
<div class="small" id="status">Offline</div>
<div class="chatbox" id="chat"></div>
<div class="small" id="typing"></div>
<input type="file" id="img" accept="image/*">
<input id="msg" placeholder="Type message">
<button onclick="sendMsg()">Send</button>
</div>

<script>
const INVITE_CODE="BLIND2026";
const CHAT_CODE="ONLYUS";
let ROOM="", user="";

firebase.initializeApp({
 apiKey:"AIzaSyAdpLNU2c-C5KxJv2weJECSpoghz_NGNtM",
 databaseURL:"https://soulroom-4e31d-default-rtdb.asia-southeast1.firebasedatabase.app"
});
const db=firebase.database();

function openMessage(){
 if(inviteCode.value!==INVITE_CODE)return alert("Wrong invite code");
 user=inviteName.value;
 step1.classList.add("hidden");
 step2.classList.remove("hidden");
}

function yesFlow(){
 step2.classList.add("hidden");
 stepLogin.classList.remove("hidden");
}

function noFlow(){location.reload()}

function enterChat(){
 if(chatCode.value!==CHAT_CODE)return alert("Wrong chat code");
 ROOM=CHAT_CODE;
 stepLogin.classList.add("hidden");
 stepChat.classList.remove("hidden");

 db.ref(`rooms/${ROOM}/users/${user}`).set({online:true,last:Date.now()});
 db.ref(`rooms/${ROOM}/users/${user}`).onDisconnect().set({online:false,last:Date.now()});

 listen();
}

function enc(t){return CryptoJS.AES.encrypt(t,ROOM).toString()}
function dec(t){return CryptoJS.AES.decrypt(t,ROOM).toString(CryptoJS.enc.Utf8)}

function sendMsg(){
 if(!msg.value && !img.files[0])return;
 const ref=db.ref(`rooms/${ROOM}/chat`).push({u:user,t:msg.value?enc(msg.value):null,seen:false});
 if(img.files[0]){
  const r=new FileReader();
  r.onload=e=>ref.update({img:e.target.result});
  r.readAsDataURL(img.files[0]);
 }
 msg.value="";img.value="";
}

function listen(){
 db.ref(`rooms/${ROOM}/chat`).on("child_added",s=>{
  const d=s.val();
  const div=document.createElement("div");
  div.className="bubble"+(d.u===user?" me":"");
  if(d.t)div.innerText=dec(d.t);
  if(d.img){
   const i=document.createElement("img");
   i.src=d.img;
   i.onclick=()=>i.classList.toggle("reveal");
   div.appendChild(i);
  }
  if(d.u===user){
   const tk=document.createElement("div");
   tk.className="tick";
   tk.innerText=d.seen?"✔✔":"✔";
   div.appendChild(tk);
  }
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  s.ref.update({seen:true});
 });

 msg.oninput=()=>{
  db.ref(`rooms/${ROOM}/typing`).set(user);
  setTimeout(()=>db.ref(`rooms/${ROOM}/typing`).remove(),800);
 };

 db.ref(`rooms/${ROOM}/typing`).on("value",s=>{
  typing.innerText=s.val() && s.val()!==user ? s.val()+" typing…" : "";
 });
}
</script>
</body>
</html>
